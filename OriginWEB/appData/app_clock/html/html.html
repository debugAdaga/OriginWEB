<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <button class="app-back-btn" onclick="closeApp()">←</button>
            <h2>Clock</h2>
            <button class="app-menu-btn">⋮</button>
        </div>

        <div class="clock-tabs">
            <button class="clock-tab active" data-tab="alarm">Alarm</button>
            <button class="clock-tab" data-tab="timer">Timer</button>
            <button class="clock-tab" data-tab="stopwatch">Stopwatch</button>
            <button class="clock-tab" data-tab="world">World</button>
        </div>

        <div class="clock-content">
            <div class="clock-tab-content active" id="alarmTab">
                <div class="current-time-display">
                    <div class="current-time" id="currentTime">00:00:00</div>
                    <div class="current-date" id="currentDate">Loading...</div>
                </div>
                <div class="alarm-section">
                    <h3>Set Alarm</h3>
                    <div class="alarm-inputs">
                        <input type="number" id="alarmHour" placeholder="HH" min="0" max="23" value="07">
                        <span>:</span>
                        <input type="number" id="alarmMinute" placeholder="MM" min="0" max="59" value="30">
                        <span>:</span>
                        <input type="number" id="alarmSecond" placeholder="SS" min="0" max="59" value="00">
                    </div>
                    <button class="set-alarm-btn" onclick="setAlarm()">Set Alarm</button>
                </div>
                <div class="alarm-list" id="alarmList">
                    <h3>Active Alarms</h3>
                    <div class="alarm-item" id="noAlarms">No alarms set</div>
                </div>
            </div>

            <div class="clock-tab-content" id="timerTab">
                <div class="timer-display" id="timerDisplay">00:05:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" onclick="startTimer()">▶ Start</button>
                    <button class="timer-btn" onclick="pauseTimer()">⏸ Pause</button>
                    <button class="timer-btn" onclick="resetTimer()">⏹ Reset</button>
                </div>
                <div class="timer-presets">
                    <button class="preset-btn" onclick="setTimerPreset(60)">1 min</button>
                    <button class="preset-btn" onclick="setTimerPreset(300)">5 min</button>
                    <button class="preset-btn" onclick="setTimerPreset(600)">10 min</button>
                    <button class="preset-btn" onclick="setTimerPreset(1800)">30 min</button>
                    <button class="preset-btn" onclick="setTimerPreset(3600)">60 min</button>
                </div>
            </div>

            <div class="clock-tab-content" id="stopwatchTab">
                <div class="stopwatch-display" id="stopwatchDisplay">00:00:00.00</div>
                <div class="stopwatch-controls">
                    <button class="stopwatch-btn" onclick="startStopwatch()">▶ Start</button>
                    <button class="stopwatch-btn" onclick="pauseStopwatch()">⏸ Pause</button>
                    <button class="stopwatch-btn" onclick="resetStopwatch()">⏹ Reset</button>
                    <button class="stopwatch-btn" onclick="lapStopwatch()">⏱ Lap</button>
                </div>
                <div class="lap-list" id="lapList">
                    <div class="lap-item" id="noLaps">No laps recorded</div>
                </div>
            </div>

            <div class="clock-tab-content" id="worldTab">
                <div class="world-clock-list" id="worldClockList">
                    <div class="world-item">
                        <div class="world-city">New York</div>
                        <div class="world-time" id="nyTime">--:--:--</div>
                    </div>
                    <div class="world-item">
                        <div class="world-city">London</div>
                        <div class="world-time" id="londonTime">--:--:--</div>
                    </div>
                    <div class="world-item">
                        <div class="world-city">Tokyo</div>
                        <div class="world-time" id="tokyoTime">--:--:--</div>
                    </div>
                    <div class="world-item">
                        <div class="world-city">Sydney</div>
                        <div class="world-time" id="sydneyTime">--:--:--</div>
                    </div>
                    <div class="world-item">
                        <div class="world-city">Dubai</div>
                        <div class="world-time" id="dubaiTime">--:--:--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
