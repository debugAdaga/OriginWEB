<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="calculator_calc">
        <div class="display_calc" id="display_calc">0</div>
        <div class="buttons_calc">
            <button class="btn_calc gray_calc" onclick="clearDisplay_calc()">AC</button>
            <button class="btn_calc gray_calc" onclick="backspace_calc()">⌫</button>
            <button class="btn_calc gray_calc" onclick="append_calc('%')">%</button>
            <button class="btn_calc orange_calc" onclick="append_calc('/')">÷</button>
            
            <button class="btn_calc" onclick="append_calc('7')">7</button>
            <button class="btn_calc" onclick="append_calc('8')">8</button>
            <button class="btn_calc" onclick="append_calc('9')">9</button>
            <button class="btn_calc orange_calc" onclick="append_calc('*')">×</button>
            
            <button class="btn_calc" onclick="append_calc('4')">4</button>
            <button class="btn_calc" onclick="append_calc('5')">5</button>
            <button class="btn_calc" onclick="append_calc('6')">6</button>
            <button class="btn_calc orange_calc" onclick="append_calc('-')">−</button>
            
            <button class="btn_calc" onclick="append_calc('1')">1</button>
            <button class="btn_calc" onclick="append_calc('2')">2</button>
            <button class="btn_calc" onclick="append_calc('3')">3</button>
            <button class="btn_calc orange_calc" onclick="append_calc('+')">+</button>
            
            <button class="btn_calc" onclick="append_calc('+/-')">±</button>
            <button class="btn_calc" onclick="append_calc('0')">0</button>
            <button class="btn_calc" onclick="append_calc('.')">.</button>
            <button class="btn_calc equal_calc" onclick="calculate_calc()">=</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
